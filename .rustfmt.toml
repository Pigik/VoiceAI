# Настройки rustfmt (форматтер «настроен и проверяется» — AN-02).
#
# Значения совпадают со встроенными по умолчанию в rustfmt, чтобы код не
# «прыгал» между машинами и версиями инструмента и чтобы `cargo fmt --check`
# в CI и в `check.ps1`/`check.sh` был стабилен.
max_width = 100
newline_style = "Auto"
edition = "2024"