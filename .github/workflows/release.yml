name: Релиз (Windows)

# Собирает готовый, самодостаточный архив с VoiceAI.exe, моделью Whisper
# и библиотеками CUDA и крепит его к GitHub Release (по тегу v*).
# Пользователям со слабыми компьютерами компилировать ничего не нужно:
# они просто скачивают готовый zip с вкладки Releases.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег для публикации при ручном запуске (например v1.0.0). Оставьте пустым, чтобы только собрать артефакт."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Проверка исходников
        uses: actions/checkout@v4

      - name: Определение тега релиза
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          "NEW_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Output "Тег релиза: $tag"

      - name: Настройка Rust (1.95 из rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Кеш зависимостей
        uses: Swatinem/rust-cache@v2

      # build.bat ищет vcvars64.bat только для редакции Community, а на
      # GitHub-раннере стоит Enterprise — настраиваем MSVC универсально.
      - name: Окружение MSVC (cl.exe)
        uses: ilammy/msvc-dev-cmd@v1

      # bindgen (генерация привязок whisper-rs) требует libclang.dll.
      # На раннере LLVM установлен, но переменная LIBCLANG_PATH не задана.
      - name: Поиск LLVM (libclang для bindgen)
        shell: pwsh
        run: |
          $paths = @(
            'C:\Program Files\LLVM\bin',
            "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin",
            "$env:ProgramFiles\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\bin"
          ) | Where-Object { Test-Path "$_\libclang.dll" }
          if ($paths) {
            "LIBCLANG_PATH=$($paths[0])" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Output "libclang найден: $($paths[0])"
          } else {
            throw "libclang.dll не найден — нужен LLVM для bindgen"
          }

      - name: Поиск CUDA Toolkit
        shell: pwsh
        run: |
          $cuda = Get-ChildItem "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA" -Directory |
                  Where-Object { $_.Name.StartsWith('v') } |
                  Sort-Object { [version]$_.Name.Substring(1) } -Descending |
                  Select-Object -First 1
          if (-not $cuda) {
            throw "CUDA Toolkit не найден на раннере"
          }
          "CUDA_PATH=$($cuda.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$($cuda.FullName)\bin;$($cuda.FullName)\bin\x64" | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Output "Используется CUDA: $($cuda.FullName)"

      # Качаем модель из нашего же GitHub Release: после первой публикации она
      # прикреплена отдельным asset'ом и живёт, пока жив репозиторий. HuggingFace
      # нужен только как bootstrap для первого релиза, когда ещё нет ни одного
      # опубликованного релиза с моделью.
      - name: Скачивание модели Whisper (свой GitHub Release)
        shell: pwsh
        run: |
          $rel = "https://github.com/${{ github.repository }}/releases/download/$env:NEW_TAG/ggml-large-v3-turbo.bin"
          Write-Output "Пробуем GitHub Release: $rel"
          .\download_models.bat "$rel"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "В GitHub Release модели пока нет (первый релиз) — используем HuggingFace."
            .\download_models.bat
            if ($LASTEXITCODE -ne 0) { throw "ОШИБКА: модель не скачана ни из GitHub Release, ни с HuggingFace" }
          }

      # build.rs сам кладёт модель и DLL CUDA рядом с exe в target\release.
      - name: Сборка релиза (CUDA)
        run: cargo build --release

      - name: Упаковка в автономный zip
        run: .\package.bat

      - name: Проверка архива
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\VoiceAI-windows-x64.zip")) {
            throw "Архив dist\VoiceAI-windows-x64.zip не создан"
          }

      - name: Сохранение артефакта (для ручного запуска без тега)
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAI-windows-x64
          path: dist/VoiceAI-windows-x64.zip
          if-no-files-found: error

      - name: Публикация в GitHub Release (по тегу v*)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          # Модель идёт вторым asset'ом, чтобы будущие релизы и те, кто
          # собирает из исходников, качали её из того же Release, а не
          # с HuggingFace.
          files: |
            dist/VoiceAI-windows-x64.zip
            ggml-large-v3-turbo.bin
          draft: true