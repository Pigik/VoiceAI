name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  # Версия из rust-toolchain.toml; для явности дублируем в шагах.
  TOOLCHAIN: "1.95.0"

jobs:
  # Форматирование — проверяется на всех трёх ОС (без сборки, дёшево).
  fmt:
    name: fmt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Установить тулчейн (${{ env.TOOLCHAIN }})
        run: |
          rustup toolchain install ${{ env.TOOLCHAIN }} --profile minimal --component rustfmt
          rustup default ${{ env.TOOLCHAIN }}
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # Статический анализ и тесты (кроме Windows: там whisper-rs собирается
  # с CUDA и требует локальный CUDA Toolkit — см. build.bat).
  lint-and-test:
    name: lint+test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Системные библиотеки (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang libclang-dev pkg-config \
            libasound2-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libssl-dev

      - name: Установить тулчейн (${{ env.TOOLCHAIN }})
        run: |
          rustup toolchain install ${{ env.TOOLCHAIN }} --profile minimal --component rustfmt,clippy
          rustup default ${{ env.TOOLCHAIN }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-targets